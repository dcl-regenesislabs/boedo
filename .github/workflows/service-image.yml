name: service image

on:
  pull_request:
    paths:
      - 'packages/service/**'
      - 'packages/contract/**'
      - 'scripts/check-secrets*'
      - 'SECURITY.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/service-image.yml'
  push:
    branches: [main]
    paths:
      - 'packages/service/**'
      - 'packages/contract/**'
      - 'scripts/check-secrets*'
      - 'SECURITY.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/service-image.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --workspace @dcl-editor/service --include-workspace-root=false --ignore-scripts
      - run: node scripts/check-secrets.mjs --history
      - run: npm audit --workspace @dcl-editor/service --omit=dev --audit-level=moderate
      - run: npm run typecheck --workspace @dcl-editor/service
      - run: npx vitest run packages/service/src
      - run: docker build -f packages/service/Dockerfile -t dcl-editor-service:local .
      - run: node packages/service/scripts/docker-smoke.mjs
