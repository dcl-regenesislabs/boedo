# Copy to wrangler.toml. Run locally with `wrangler dev`, never deployed (README.md, "Cloudflare deployment").
name = "dcl-editor-projects"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
# eth-connect (inside @dcl/crypto) refers to Buffer
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "dcl-editor-projects"

[vars]
ALLOWED_ORIGINS = "https://decentraland.zone"
# MAX_WALLET_BYTES = "524288000"
# one isolate has 128 MB: room for one 50 MB upload at a time
UPLOAD_BYTES_IN_FLIGHT = "67108864"
# ETH_RPC_URL = "https://rpc.decentraland.org/mainnet"

# Secret, at least 32 characters:  wrangler secret put TICKET_SECRET

[triggers]
# each trigger is one bounded purge run (PURGE_WALLETS_PER_RUN wallets)
crons = ["*/10 * * * *"]
